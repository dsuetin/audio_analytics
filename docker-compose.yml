networks:
  speech:
    # external: true

x-daily-stats: &daily-stats
  build:
    context: .
    dockerfile: stats_service/Dockerfile

  networks:
    - speech

  depends_on:
    - postgres

  volumes:
    - ./reports:/reports
    - ./stats_service:/app/stats_service
    # Offline analysis (offline_analysis/run.py) is chained into the daily pipeline by
    # stats_service.scheduler, which resolves repo_root=/app. Mount the package so the
    # analyzer can be imported/executed from inside the scheduler container.
    - ./offline_analysis:/app/offline_analysis

  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: speech
    POSTGRES_PASSWORD: speech
    POSTGRES_DB: speech_db
    REPORT_TIMEZONE: Europe/Moscow
    REPORT_OUTPUT_DIR: /reports
    # Offline analysis (Qwen via Ollama). From inside the `speech` network the host
    # loopback is not reachable, so default OLLAMA_HOST to the bridge gateway (where
    # Ollama listens on the host). All values are overridable via the environment.
    OLLAMA_HOST: ${OLLAMA_HOST:-http://172.18.0.1:11434}
    OFFLINE_LLM_MODEL: ${OFFLINE_LLM_MODEL:-qwen3.8:27b}
    # Chain the offline step after the raw report (set to 0 to keep raw-only behavior).
    OFFLINE_ANALYSIS_ENABLED: ${OFFLINE_ANALYSIS_ENABLED:-1}
    # Sequential (no LLM parallelism) so a single nightly block never exceeds the timeout;
    # generous per-request timeout because Qwen3.8:27B is slow on long blocks.
    OFFLINE_WORKERS: ${OFFLINE_WORKERS:-1}
    OFFLINE_LLM_TIMEOUT: ${OFFLINE_LLM_TIMEOUT:-3600}

services:

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    networks:
      - speech
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      # INTERNAL + EXTERNAL listeners
      - --kafka-addr
      - INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092

      # ADVERTISED ADDRESSES (самое важное место)
      - --advertise-kafka-addr
      # - INTERNAL://redpanda:9092,EXTERNAL://192.168.0.10:19092      
      # - INTERNAL://redpanda:9092,EXTERNAL://10.201.0.9:19092
      - INTERNAL://redpanda:9092,EXTERNAL://172.16.20.111:19092
      # - INTERNAL://redpanda:9092,EXTERNAL://localhost:19092


    ports:
      - "9092:9092"
      - "19092:19092"
      - "9644:9644"   # admin API (optional)
    restart: unless-stopped

  minio:

    image: minio/minio:latest
    container_name: minio

    command: server /data --console-address ":9001"
    networks:
      - speech
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data
    restart: unless-stopped

  worker:
    platform: linux/amd64
    volumes:
      - ./storage_worker:/app/storage_worker
      - ./proto:/app/proto
    image: audio_analytics-worker:latest
    build:
      context: .
      dockerfile: storage_worker/Dockerfile

    container_name: storage-worker
    networks:
      - speech
    depends_on:
      - redpanda
      - minio

    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: audio-sessions

      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_EVENTS_TOPIC: audio_events

      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50051

    ports:
      - "50051:50051"
    restart: unless-stopped
  
  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    depends_on:
      - redpanda
    networks:
      - speech
    restart: unless-stopped
  vad-client:
    image: audio_analytics-vad-client:latest
    build:
      context: .
      dockerfile: client/Dockerfile
    volumes:
      - ./client:/app/client
      # - ./proto:/app/proto
    container_name: vad-client
    networks:
      - speech
    depends_on:
      - worker

    environment:
      STORAGE_HOST: worker:50051
      PYTHONUNBUFFERED: 1

    ports:
      - "6000:6000"
    restart: unless-stopped

  asr_worker:
    image: audio_analytics-asr_worker:latest
    build:
      context: .
      dockerfile: asr_worker/Dockerfile

    container_name: asr_worker

    networks:
      - speech

    depends_on:
      - redpanda
      - minio
      # - asr
      # - worker   # опционально, если потом S3/события от storage важны
    volumes:
      - ./client:/app/client
      - ./asr_worker:/app/asr_worker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC: audio_events
      S3_ENDPOINT: http://minio:9000
      POSTGRES_DSN: postgresql://speech:speech@postgres:5432/speech_db

      PYTHONUNBUFFERED: 1

    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres
    networks:
      - speech
    environment:
      POSTGRES_USER: speech
      POSTGRES_PASSWORD: speech
      POSTGRES_DB: speech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped


  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    networks:
      - speech
    environment:
      PGADMIN_DEFAULT_EMAIL: suetindaniil@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

  asr:
    image: asr:latest
    container_name: triton-asr
    networks:
      - speech
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      # ASR_USE_LM: "True"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

  vad:
    platform: linux/amd64
    image: vad_server:latest
    networks:
      - speech
    container_name: server_triton-speech-segmentation
    ulimits:
      memlock: -1
      stack: -1
    shm_size: 4g
    working_dir: /mnt
    ports:
    - "8001:8001"

    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      # ASR_USE_LM: "True"
      TRITON_PARAMETERS: >
        --model-config-name=gpu
        --model-control-mode=explicit
        --load-model marblenet
        --load-model online_vad
        --load-model offline_vad
      TRITON_SERVER_ARGS: >
        --model-repository=/mnt/models
        --backend-config=onnxruntime,intra_op_thread_count=1
        --backend-config=onnxruntime,inter_op_thread_count=1
        --backend-config=onnxruntime,execution_mode=1
        --backend-config=onnxruntime,enable-global-threadpool=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

    restart: unless-stopped

    
  classification_service:
    image: audio_analytics-classification_service:latest
    build:
      context: .
      dockerfile: classification/Dockerfile

    container_name: classification-service

    networks:
      - speech

    depends_on:
      - redpanda

    volumes:
      - ./classification:/app/classification

    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_INPUT_TOPIC: asr_transcripts
      KAFKA_OUTPUT_TOPIC: classified_events
      
      POSTGRES_USER: speech
      POSTGRES_PASSWORD: speech
      POSTGRES_DB: speech_db
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DSN: postgresql://speech:speech@postgres:5432/speech_db
      
      PYTHONUNBUFFERED: 1

    restart: unless-stopped

  daily_stats_scheduler:
    <<: *daily-stats
    image: audio_analytics-daily_stats_service:latest
    container_name: daily-stats-scheduler
    command: ["python3", "-m", "stats_service.scheduler"]

    restart: unless-stopped

  daily_stats_api:
    <<: *daily-stats
    image: audio_analytics-daily_stats_service:latest
    container_name: daily-stats-api
    command:
      - uvicorn
      - stats_service.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"

    restart: unless-stopped

  
  alert_service:
    image: audio_analytics-alert_service:latest
    build:
      context: .
      dockerfile: alert_service/Dockerfile

    env_file:
      - .env

    container_name: alert-service

    networks:
      - speech

    depends_on:
      - redpanda
      - postgres

    volumes:
      - ./alert_service:/app/alert_service

    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092

      KAFKA_INPUT_TOPIC: asr_transcripts
      KAFKA_ALERT_TOPIC: alerts

      POSTGRES_USER: speech
      POSTGRES_PASSWORD: speech
      POSTGRES_DB: speech_db
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DSN: postgresql://speech:speech@postgres:5432/speech_db

      PYTHONUNBUFFERED: 1
      NOTIFICATION_CHANNEL: ${NOTIFICATION_CHANNEL:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      MAX_CHAT_ID: ${MAX_CHAT_ID}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

    restart: unless-stopped

volumes:
  minio_data:
  postgres_data:
