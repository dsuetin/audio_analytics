networks:
  speech:
    # external: true

services:

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    networks:
      - speech
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      # INTERNAL + EXTERNAL listeners
      - --kafka-addr
      - INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092

      # ADVERTISED ADDRESSES (самое важное место)
      - --advertise-kafka-addr
      - INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
      

    ports:
      - "9092:9092"
      - "19092:19092"
      - "9644:9644"   # admin API (optional)
    restart: unless-stopped

  minio:

    image: minio/minio:latest
    container_name: minio

    command: server /data --console-address ":9001"
    networks:
      - speech
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data
    restart: unless-stopped

  worker:
    platform: linux/amd64
    volumes:
      - ./storage_worker:/app/storage_worker
      - ./proto:/app/proto
    build:
      context: .
      dockerfile: storage_worker/Dockerfile

    container_name: storage-worker
    networks:
      - speech
    depends_on:
      - redpanda
      - minio

    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: audio-sessions

      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_EVENTS_TOPIC: audio_events

      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50051

    ports:
      - "50051:50051"
    restart: unless-stopped
  
  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    depends_on:
      - redpanda
    networks:
      - speech
    restart: unless-stopped
  vad-client:
    build:
      context: .
      dockerfile: client/Dockerfile
    volumes:
      - ./client:/app/client
      # - ./proto:/app/proto
    container_name: vad-client
    networks:
      - speech
    depends_on:
      - worker

    environment:
      STORAGE_HOST: worker:50051
      PYTHONUNBUFFERED: 1

    ports:
      - "6000:6000"
    restart: unless-stopped

  asr_worker:
    build:
      context: .
      dockerfile: asr_worker/Dockerfile

    container_name: asr_worker

    networks:
      - speech

    depends_on:
      - redpanda
      - minio
      # - asr
      # - worker   # опционально, если потом S3/события от storage важны
    volumes:
      - ./client:/app/client
      - ./asr_worker:/app/asr_worker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC: audio_events
      S3_ENDPOINT: http://minio:9000
      POSTGRES_DSN: postgresql://speech:speech@postgres:5432/speech_db

      PYTHONUNBUFFERED: 1

    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres
    networks:
      - speech
    environment:
      POSTGRES_USER: speech
      POSTGRES_PASSWORD: speech
      POSTGRES_DB: speech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped


  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    networks:
      - speech
    environment:
      PGADMIN_DEFAULT_EMAIL: suetindaniil@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

  asr:
    image: asr_emformer_mic_cpu:1.0.0
    container_name: triton-asr
    networks:
      - speech
    restart: unless-stopped

  vad:
    platform: linux/amd64
    image: vad_server:latest
    networks:
      - speech
    container_name: server_triton-speech-segmentation
    ulimits:
      memlock: -1
      stack: -1
    shm_size: 4g
    working_dir: /mnt
    ports:
    - "8001:8001"

    environment:
      TRITON_PARAMETERS: >
        --model-config-name=cpu
        --model-control-mode=explicit
        --load-model marblenet
        --load-model online_vad
        --load-model offline_vad

      TRITON_SERVER_ARGS: >
        --model-repository=/mnt/models
        --backend-config=onnxruntime,intra_op_thread_count=1
        --backend-config=onnxruntime,inter_op_thread_count=1
        --backend-config=onnxruntime,execution_mode=1
        --backend-config=onnxruntime,enable-global-threadpool=1
    restart: unless-stopped

  classification_service:
    build:
      context: .
      dockerfile: classification/Dockerfile

    container_name: classification-service

    networks:
      - speech

    depends_on:
      - redpanda

    volumes:
      - ./classification:/app/classification

    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_INPUT_TOPIC: asr_transcripts
      KAFKA_OUTPUT_TOPIC: classified_events
      
      POSTGRES_USER: speech
      POSTGRES_PASSWORD: speech
      POSTGRES_DB: speech_db
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DSN: postgresql://speech:speech@postgres:5432/speech_db
      
      PYTHONUNBUFFERED: 1

    restart: unless-stopped

  alert_service:
    build:
      context: .
      dockerfile: alert_service/Dockerfile

    env_file:
      - .env

    container_name: alert-service

    networks:
      - speech

    depends_on:
      - redpanda
      - postgres

    volumes:
      - ./alert_service:/app/alert_service

    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092

      KAFKA_INPUT_TOPIC: asr_transcripts
      KAFKA_ALERT_TOPIC: alerts

      POSTGRES_USER: speech
      POSTGRES_PASSWORD: speech
      POSTGRES_DB: speech_db
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DSN: postgresql://speech:speech@postgres:5432/speech_db

      PYTHONUNBUFFERED: 1

    restart: unless-stopped

volumes:
  minio_data:
  postgres_data:

