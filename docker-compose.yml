networks:
  speech:
    # external: true

# LLM services configuration (llama.cpp servers with GPU)
x-llama-server: &llama-server
  build:
    context: .
    dockerfile: Dockerfile.llama-server
  networks:
    - speech
  mem_limit: 32G
  memswap_limit: 36G
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/v1/models"]
    interval: 30s
    timeout: 10s
    start_period: 120s
    retries: 3

x-daily-stats: &daily-stats
  build:
    context: .
    dockerfile: stats_service/Dockerfile

  networks:
    - speech

  depends_on:
    - postgres

  volumes:
    - ./reports:/reports
    - ./stats_service:/app/stats_service
    # Offline analysis (offline_analysis/run.py) is chained into the daily pipeline by
    # stats_service.scheduler, which resolves repo_root=/app. Mount the package so the
    # analyzer can be imported/executed from inside the scheduler container.
    - ./offline_analysis:/app/offline_analysis

  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: speech
    POSTGRES_PASSWORD: speech
    POSTGRES_DB: speech_db
    REPORT_TIMEZONE: Europe/Moscow
    REPORT_OUTPUT_DIR: /reports
    # Offline analysis (Qwen via llama.cpp).
    # LLAMACPP_HOST points to the llama-server service in the speech network.
    # From the host, use http://172.16.20.111:8081/v1 or http://172.16.20.111:8082/v1
    LLAMACPP_HOST: ${LLAMACPP_HOST:-http://llama-8082:8080/v1}
    OFFLINE_LLM_MODEL: ${OFFLINE_LLM_MODEL:-Qwen3.5-27B-UD-Q4_K_XL.gguf}
    # Chain the offline step after the raw report (set to 0 to keep raw-only behavior).
    OFFLINE_ANALYSIS_ENABLED: ${OFFLINE_ANALYSIS_ENABLED:-1}
    # Sequential (no LLM parallelism) so a single nightly block never exceeds the timeout;
    # generous per-request timeout because Qwen3.8:27B is slow on long blocks.
    OFFLINE_WORKERS: ${OFFLINE_WORKERS:-1}
    OFFLINE_LLM_TIMEOUT: ${OFFLINE_LLM_TIMEOUT:-3600}

services:

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    networks:
      - speech
    mem_limit: 2G
    memswap_limit: 2G
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      # INTERNAL + EXTERNAL listeners
      - --kafka-addr
      - INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092

      # ADVERTISED ADDRESSES (самое важное место)
      - --advertise-kafka-addr
      # - INTERNAL://redpanda:9092,EXTERNAL://192.168.0.10:19092      
      # - INTERNAL://redpanda:9092,EXTERNAL://10.201.0.9:19092
      - INTERNAL://redpanda:9092,EXTERNAL://172.16.20.111:19092
      # - INTERNAL://redpanda:9092,EXTERNAL://localhost:19092


    ports:
      - "9092:9092"
      - "19092:19092"
      - "9644:9644"   # admin API (optional)
    restart: unless-stopped

  minio:

    image: minio/minio:latest
    container_name: minio

    mem_limit: 4G
    memswap_limit: 4G
    command: server /data --console-address ":9001"
    networks:
      - speech
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - /mnt/data/minio:/data
    restart: unless-stopped

  worker:
    platform: linux/amd64
    volumes:
      - ./storage_worker:/app/storage_worker
      - ./proto:/app/proto
    image: audio_analytics-worker:latest
    build:
      context: .
      dockerfile: storage_worker/Dockerfile

    container_name: storage-worker
    mem_limit: 2G
    memswap_limit: 2G
    networks:
      - speech
    depends_on:
      - redpanda
      - minio

    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: audio-sessions

      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_EVENTS_TOPIC: audio_events

      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50051

    ports:
      - "50051:50051"
    restart: unless-stopped
  
  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    mem_limit: 512M
    memswap_limit: 1G
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    depends_on:
      - redpanda
    networks:
      - speech
    restart: unless-stopped
  vad-client:
    image: audio_analytics-vad-client:latest
    build:
      context: .
      dockerfile: client/Dockerfile
    volumes:
      - ./client:/app/client
      # - ./proto:/app/proto
    container_name: vad-client
    mem_limit: 512M
    memswap_limit: 1G
    networks:
      - speech
    depends_on:
      - worker

    environment:
      STORAGE_HOST: worker:50051
      PYTHONUNBUFFERED: 1

    ports:
      - "6000:6000"
    restart: unless-stopped

  asr_worker:
    image: audio_analytics-asr_worker:latest
    build:
      context: .
      dockerfile: asr_worker/Dockerfile

    container_name: asr_worker
    mem_limit: 8G
    memswap_limit: 8G
    networks:
      - speech

    depends_on:
      - redpanda
      - minio
      # - asr
      # - worker   # опционально, если потом S3/события от storage важны
    volumes:
      - ./client:/app/client
      - ./asr_worker:/app/asr_worker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC: audio_events
      S3_ENDPOINT: http://minio:9000
      POSTGRES_DSN: postgresql://speech:speech@postgres:5432/speech_db

      PYTHONUNBUFFERED: 1

    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres
    mem_limit: 4G
    memswap_limit: 4G
    networks:
      - speech
    environment:
      POSTGRES_USER: speech
      POSTGRES_PASSWORD: speech
      POSTGRES_DB: speech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped


  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    mem_limit: 1G
    memswap_limit: 2G
    networks:
      - speech
    environment:
      PGADMIN_DEFAULT_EMAIL: suetindaniil@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

  asr:
    image: asr:latest
    container_name: triton-asr
    mem_limit: 8G
    memswap_limit: 8G
    networks:
      - speech
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      # ASR_USE_LM: "True"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

  vad:
    platform: linux/amd64
    image: vad_server:latest
    networks:
      - speech
    container_name: server_triton-speech-segmentation
    mem_limit: 8G
    memswap_limit: 8G
    ulimits:
      memlock: -1
      stack: -1
    shm_size: 4g
    working_dir: /mnt
    ports:
    - "8001:8001"

    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      # ASR_USE_LM: "True"
      TRITON_PARAMETERS: >
        --model-config-name=gpu
        --model-control-mode=explicit
        --load-model marblenet
        --load-model online_vad
        --load-model offline_vad
        --load-model diarization
        --load-model vad
        --load-model embedder
        --load-model clusterer
        --load-model boundary_detector
      TRITON_SERVER_ARGS: >
        --model-repository=/mnt/models
        --backend-config=onnxruntime,intra_op_thread_count=1
        --backend-config=onnxruntime,inter_op_thread_count=1
        --backend-config=onnxruntime,execution_mode=1
        --backend-config=onnxruntime,enable-global-threadpool=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

    restart: unless-stopped

    
  classification_service:
    image: audio_analytics-classification_service:latest
    build:
      context: .
      dockerfile: classification/Dockerfile

    container_name: classification-service
    mem_limit: 1G
    memswap_limit: 2G
    networks:
      - speech

    depends_on:
      - redpanda

    volumes:
      - ./classification:/app/classification

    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_INPUT_TOPIC: asr_transcripts
      KAFKA_OUTPUT_TOPIC: classified_events
      
      POSTGRES_USER: speech
      POSTGRES_PASSWORD: speech
      POSTGRES_DB: speech_db
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DSN: postgresql://speech:speech@postgres:5432/speech_db
      
      PYTHONUNBUFFERED: 1

    restart: unless-stopped

  daily_stats_scheduler:
    <<: *daily-stats
    image: audio_analytics-daily_stats_service:latest
    container_name: daily-stats-scheduler
    mem_limit: 2G
    memswap_limit: 2G
    command: ["python3", "-m", "stats_service.scheduler"]

    restart: unless-stopped

  daily_stats_api:
    <<: *daily-stats
    image: audio_analytics-daily_stats_service:latest
    container_name: daily-stats-api
    mem_limit: 2G
    memswap_limit: 2G
    command:
      - uvicorn
      - stats_service.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: audio-sessions
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: speech
      POSTGRES_PASSWORD: speech
      POSTGRES_DB: speech_db
      REPORT_OUTPUT_DIR: /reports

    restart: unless-stopped

  daily_stats_api_test:
    <<: *daily-stats
    image: audio_analytics-daily_stats_service:latest
    container_name: daily-stats-api-test
    mem_limit: 2G
    memswap_limit: 2G
    command:
      - uvicorn
      - stats_service.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8010"
    volumes:
      - ./tests/reports:/tests_reports
      - ./stats_service:/app/stats_service
      - ./offline_analysis:/app/offline_analysis
    ports:
      - "8010:8010"
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: audio-sessions
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: speech
      POSTGRES_PASSWORD: speech
      POSTGRES_DB: speech_db
      REPORT_OUTPUT_DIR: /tests_reports
      LLAMACPP_HOST: ${LLAMACPP_HOST:-http://llama-8082:8080/v1}
      OFFLINE_LLM_MODEL: ${OFFLINE_LLM_MODEL:-Qwen3.5-27B-UD-Q4_K_XL.gguf}
      OFFLINE_ANALYSIS_ENABLED: ${OFFLINE_ANALYSIS_ENABLED:-1}
      OFFLINE_WORKERS: ${OFFLINE_WORKERS:-1}
      OFFLINE_LLM_TIMEOUT: ${OFFLINE_LLM_TIMEOUT:-3600}

    restart: unless-stopped

  
  alert_service:
    image: audio_analytics-alert_service:latest
    build:
      context: .
      dockerfile: alert_service/Dockerfile

    env_file:
      - .env

    container_name: alert-service
    mem_limit: 4G
    memswap_limit: 4G
    networks:
      - speech

    depends_on:
      - redpanda
      - postgres

    volumes:
      - ./alert_service:/app/alert_service

    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092

      KAFKA_INPUT_TOPIC: asr_transcripts
      KAFKA_ALERT_TOPIC: alerts

      POSTGRES_USER: speech
      POSTGRES_PASSWORD: speech
      POSTGRES_DB: speech_db
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DSN: postgresql://speech:speech@postgres:5432/speech_db

      PYTHONUNBUFFERED: 1
      NOTIFICATION_CHANNEL: ${NOTIFICATION_CHANNEL:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      MAX_CHAT_ID: ${MAX_CHAT_ID}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

    restart: unless-stopped

  audio_retention_monitor:
    image: audio_analytics-audio_retention_monitor:latest
    build:
      context: ./audio_retention
      dockerfile: Dockerfile

    container_name: audio-retention-monitor
    mem_limit: 256M
    memswap_limit: 512M
    networks:
      - speech

    depends_on:
      - minio

    volumes:
      - ./audio_retention:/app
      - audio_retention_logs:/var/log/audio_retention
      - audio_retention_locks:/var/lib/audio_retention

    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: audio-sessions
      AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-30}
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
      DRY_RUN: ${DRY_RUN:-false}
      MODE: ${RETENTION_MODE:-scheduled}
      SCHEDULE_HOUR: ${SCHEDULE_HOUR:-3}
      MAX_PARALLEL_DELETES: ${MAX_PARALLEL_DELETES:-10}
      LOG_FILE: /var/log/audio_retention/retention.log
      LOCK_FILE: /var/lib/audio_retention/retention.lock

    restart: unless-stopped

  # # Llama.cpp server 1 (GPU 0: f7e2dab1-0073-d8e6-2e0c-1b78dbba2db9)
